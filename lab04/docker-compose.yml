services:
  app:
    build: .
    environment:
      - GREETING=Witaj z docker compose
      # z ustawionym PORT aplikacja po zapisaniu wyniku serwuje /data po HTTP
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./dane:/data
